spring:
  application:
    name: asp-platform
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
  
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/asp_platform}
    username: ${DATASOURCE_USERNAME:asp}
    password: ${DATASOURCE_PASSWORD:asp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true  # Temporarily disabled due to V9 checksum mismatch - will repair after startup
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-enums-using-to-string: false
    deserialization:
      fail-on-unknown-properties: true

asp:
  platform:
    public-base-url: ${ASP_PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    local-base-path: ${ASP_LOCAL_STORAGE_BASE_PATH:./storage}
  ingestion:
    processor:
      enabled: false
      poll-interval-ms: 2000
      batch-size: 5

# Google OAuth Configuration
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/auth/google/callback}
    scopes: ${GOOGLE_OAUTH_SCOPES:openid,email,profile}

# AWS Configuration
# Queue URL is resolved via:
# 1. Environment variable: ASP_SQS_INGESTION_QUEUE_URL (local/dev)
# 2. AWS Secrets Manager: aws.secrets-manager.secret-name (production)
aws:
  region: ${AWS_REGION:us-east-1}
  secrets-manager:
    secret-name: ${AWS_SECRETS_MANAGER_SECRET_NAME:}  # Optional: Secret name in AWS Secrets Manager containing queue URL

# S3 config (env-based)
# AWS_REGION: e.g. eu-west-1
# ASP_S3_BUCKET_NAME: S3 bucket name where ingestion PDFs are stored

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.asp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

